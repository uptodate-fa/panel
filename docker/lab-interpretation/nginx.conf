server {
    listen 80;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;
    
    # Disable access logs for debugging (optional)
    access_log off;
    error_log /var/log/nginx/error.log debug;
    
    # Main location - serve files as-is
    location / {
        # Decode URL-encoded paths (handles %20 for spaces)
        # Try the URI, then as directory, then with index.html
        try_files $uri $uri/ $uri/index.html =404;
    }
}

